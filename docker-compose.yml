services:
  verdaccio:
    image: verdaccio/verdaccio:5
    container_name: sg-verdaccio
    ports:
      - "4873:4873"
    volumes:
      - ./verdaccio-storage:/verdaccio/storage

  attacker:
    image: node:18-alpine
    container_name: sg-attacker
    working_dir: /attack
    volumes:
      - ./simulator:/attack
    command: sh -c "sleep infinity"
    depends_on:
      - verdaccio
